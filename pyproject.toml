[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eco-ai"
version = "0.1.0"
description = "Analiza el impacto ecológico de tus prompts de IA y sugiere cómo optimizarlos"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Maria Prokhorova" },
]
requires-python = ">=3.8"
keywords = ["ai", "sustainability", "prompts", "green-computing", "cli"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: Utilities",
    "Intended Audience :: Developers",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "tiktoken>=0.7",
]

[project.scripts]
eco-ai = "eco_ai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["eco_ai"]
